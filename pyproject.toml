[project]
name = "airline-finance-command-center"
version = "0.2.0"
description = "Automated airline finance and performance management system using official BTS data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.scripts]
afcc-discover = "airline_finance_command_center.cli:main"
afcc-download = "airline_finance_command_center.downloads:main"
afcc-transtats = "airline_finance_command_center.transtats_webforms:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
