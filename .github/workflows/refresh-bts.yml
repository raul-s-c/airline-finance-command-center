name: Refresh Delta BTS data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 5 * *'
  push:
    paths:
      - '.github/workflows/refresh-bts.yml'
      - 'src/airline_finance_command_center/bts_delta_pipeline.py'
      - 'src/airline_finance_command_center/bts_delta_pipeline_v2.py'
      - 'src/airline_finance_command_center/bts_delta_pipeline_v3.py'
      - 'src/airline_finance_command_center/transtats_csv.py'
      - 'src/airline_finance_command_center/transtats_webforms.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bts-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and tests
        run: python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: python -m pytest

      - name: Build official Delta BTS layer
        run: |
          python -m airline_finance_command_center.bts_delta_pipeline_v3 \
            --output web/data/bts_summary.json \
            --work-dir /tmp/afcc-bts \
            --timeout 900

      - name: Validate published output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('web/data/bts_summary.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['metadata']['status'] == 'official_bts_transtats'
          assert data['metadata']['pipeline_version'] == 3
          assert data['metadata']['iata_code'] == 'DL'
          assert len(data['p12_financials']) == 8, 'Expected 8 Delta P-1.2 quarters'
          assert len(data['p12a_fuel']) == 24, 'Expected 24 Delta P-12(a) months'
          assert len(data['t100_network']['history']) == 24, 'Expected 24 Delta T-100 months'
          assert data['t100_network']['route_history'], 'No retained-window route history'
          assert data['t100_network']['aircraft_type_history'], 'No retained-window aircraft history'
          assert data['b43_fleet']['active_aircraft_count'] > 0, 'No active Delta B-43 aircraft'
          route_counts = data['t100_network'].get('route_scope_counts', {})
          assert route_counts.get('domestic', 0) > 0, 'No domestic routes retained'
          assert route_counts.get('international', 0) > 0, 'No international routes retained'
          print('P-1.2 quarters:', len(data['p12_financials']))
          print('P-12(a) months:', len(data['p12a_fuel']))
          print('T-100 months:', len(data['t100_network']['history']))
          print('Routes by scope:', route_counts)
          print('B-43 active aircraft:', data['b43_fleet']['active_aircraft_count'])
          PY

      - name: Rebase generated output onto latest main
        run: |
          cp web/data/bts_summary.json /tmp/bts_summary.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p web/data
          cp /tmp/bts_summary.json web/data/bts_summary.json

      - name: Commit compact BTS output when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/bts_summary.json
          if git diff --cached --quiet; then
            echo 'No BTS output changes to commit.'
          else
            git commit -m 'data: refresh official Delta BTS outputs'
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
