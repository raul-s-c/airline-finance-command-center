name: Finalize dashboard comparison QA

on:
  push:
    paths:
      - '.github/workflows/dashboard-qa-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch comparison edge cases
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/app.js')
          s = path.read_text(encoding='utf-8')

          replacements = []

          replacements.append((
'''function compareIndex(index, cadence) {
  const offset = state.compare === "prior" ? 1 : cadence === "monthly" ? 12 : 4;
  return Math.max(0, index - offset);
}
''',
'''function comparisonOffset(cadence) {
  return state.compare === "prior" ? 1 : cadence === "monthly" ? 12 : 4;
}

function compareIndex(index, cadence) {
  return index - comparisonOffset(cadence);
}

function hasComparator(index, cadence) {
  return compareIndex(index, cadence) >= 0;
}
'''))

          replacements.append((
'''function getFinancialSelection() {
  const data = btsReady() ? bts.p12_financials || [] : [];
  if (!data.length) return { data, current: null, prior: null, currentIndex: -1 };
  const requested = state.financialPeriod;
  let idx = requested ? data.findIndex((d) => d.period === requested) : data.length - 1;
  if (idx < 0) idx = data.length - 1;
  const priorIdx = compareIndex(idx, "quarterly");
  return { data, current: data[idx], prior: data[priorIdx], currentIndex: idx, priorIndex: priorIdx };
}
''',
'''function getFinancialSelection() {
  const data = btsReady() ? bts.p12_financials || [] : [];
  if (!data.length) return { data, current: null, prior: null, currentIndex: -1 };
  const requested = state.financialPeriod;
  let idx = requested ? data.findIndex((d) => d.period === requested) : data.length - 1;
  if (idx < 0 || !hasComparator(idx, "quarterly")) idx = data.length - 1;
  const priorIdx = compareIndex(idx, "quarterly");
  return { data, current: data[idx], prior: priorIdx >= 0 ? data[priorIdx] : null, currentIndex: idx, priorIndex: priorIdx };
}
'''))

          replacements.append((
'''function getFuelSelection() {
  const data = btsReady() ? bts.p12a_fuel || [] : [];
  if (!data.length) return { data, current: null, prior: null, currentIndex: -1 };
  const requested = state.fuelPeriod;
  let idx = requested ? data.findIndex((d) => d.period === requested) : data.length - 1;
  if (idx < 0) idx = data.length - 1;
  const priorIdx = compareIndex(idx, "monthly");
  return { data, current: data[idx], prior: data[priorIdx], currentIndex: idx, priorIndex: priorIdx };
}
''',
'''function getFuelSelection() {
  const data = btsReady() ? bts.p12a_fuel || [] : [];
  if (!data.length) return { data, current: null, prior: null, currentIndex: -1 };
  const requested = state.fuelPeriod;
  let idx = requested ? data.findIndex((d) => d.period === requested) : data.length - 1;
  if (idx < 0 || !hasComparator(idx, "monthly")) idx = data.length - 1;
  const priorIdx = compareIndex(idx, "monthly");
  return { data, current: data[idx], prior: priorIdx >= 0 ? data[priorIdx] : null, currentIndex: idx, priorIndex: priorIdx };
}
'''))

          replacements.append((
'''function getNetworkSelection() {
  const all = btsReady() ? bts.t100_network?.history || [] : [];
  const data = retained(all, state.range).map(networkRowForScope);
  if (!data.length) return { data, current: null, prior: null, currentIndex: -1 };
  const requested = state.networkPeriod;
  let idx = requested ? data.findIndex((d) => d.period === requested) : data.length - 1;
  if (idx < 0) idx = data.length - 1;
  const priorIdx = compareIndex(idx, "monthly");
  return { data, current: data[idx], prior: data[priorIdx], currentIndex: idx, priorIndex: priorIdx };
}
''',
'''function getNetworkSelection() {
  const all = btsReady() ? bts.t100_network?.history || [] : [];
  const full = all.map(networkRowForScope);
  const data = retained(full, state.range);
  if (!data.length) return { data, current: null, prior: null, currentIndex: -1, full };
  const requested = state.networkPeriod;
  let displayIdx = requested ? data.findIndex((d) => d.period === requested) : data.length - 1;
  if (displayIdx < 0) displayIdx = data.length - 1;
  let current = data[displayIdx];
  let fullIdx = full.findIndex((d) => d.period === current.period);
  if (!hasComparator(fullIdx, "monthly")) {
    displayIdx = data.length - 1;
    current = data[displayIdx];
    fullIdx = full.findIndex((d) => d.period === current.period);
  }
  const priorIdx = compareIndex(fullIdx, "monthly");
  return { data, current, prior: priorIdx >= 0 ? full[priorIdx] : null, currentIndex: displayIdx, priorIndex: priorIdx, full };
}
'''))

          replacements.append((
'''function financialPeriodOptions(data, selected) {
  return data.slice().reverse().map((item) => `<option value="${esc(item.period)}" ${item.period === selected ? "selected" : ""}>${esc(item.period)}</option>`).join("");
}
''',
'''function financialPeriodOptions(data, selected) {
  return data.map((item, index) => ({ item, index }))
    .filter(({ index }) => hasComparator(index, "quarterly"))
    .reverse()
    .map(({ item }) => `<option value="${esc(item.period)}" ${item.period === selected ? "selected" : ""}>${esc(item.period)}</option>`)
    .join("");
}
'''))

          replacements.append((
'''<select class="table-search" id="fuel-period-select">${sel.data.slice().reverse().map((item) => `<option value="${esc(item.period)}" ${item.period === current?.period ? "selected" : ""}>${esc(item.period)}</option>`).join("")}</select>''',
'''<select class="table-search" id="fuel-period-select">${sel.data.map((item,index)=>({item,index})).filter(({index})=>hasComparator(index,"monthly")).reverse().map(({item}) => `<option value="${esc(item.period)}" ${item.period === current?.period ? "selected" : ""}>${esc(item.period)}</option>`).join("")}</select>'''))

          replacements.append((
'''  if (!state.variancePeriod || !data.some((d)=>d.period===state.variancePeriod)) state.variancePeriod = data.at(-1).period;
  const idx = data.findIndex((d)=>d.period===state.variancePeriod);
  const priorIdx = compareIndex(idx, def.cadence);
''',
'''  if (!state.variancePeriod || !data.some((d)=>d.period===state.variancePeriod)) state.variancePeriod = data.at(-1).period;
  let idx = data.findIndex((d)=>d.period===state.variancePeriod);
  if (!hasComparator(idx, def.cadence)) { idx = data.length - 1; state.variancePeriod = data[idx].period; }
  const priorIdx = compareIndex(idx, def.cadence);
'''))

          replacements.append((
'''<div class="filter-control"><label>Period</label><select id="variance-period-select">${data.slice().reverse().map((d)=>`<option value="${d.period}" ${d.period===state.variancePeriod?"selected":""}>${d.period}</option>`).join("")}</select></div>''',
'''<div class="filter-control"><label>Period</label><select id="variance-period-select">${data.map((d,index)=>({d,index})).filter(({index})=>hasComparator(index,def.cadence)).reverse().map(({d})=>`<option value="${d.period}" ${d.period===state.variancePeriod?"selected":""}>${d.period}</option>`).join("")}</select></div>'''))

          # Add a visible selected-month control to the Network Explorer.
          replacements.append((
'''  dashboard.innerHTML = `
    <section class="kpi-grid">''',
'''  dashboard.innerHTML = `
    <section class="filter-context panel">
      <div class="panel-header"><div><h2>Selected network month</h2><p class="panel-subtitle">Choose any visible month. Year-over-year comparison still uses the full retained 24-month history.</p></div><select class="table-search" id="network-period-select">${sel.data.slice().reverse().filter((item)=>{const fullIndex=sel.full.findIndex((d)=>d.period===item.period);return hasComparator(fullIndex,"monthly");}).map((item)=>`<option value="${esc(item.period)}" ${item.period===sel.current?.period?"selected":""}>${esc(item.period)}</option>`).join("")}</select></div>
    </section>
    <section class="kpi-grid">'''))

          replacements.append((
'''  document.querySelectorAll("[data-route]").forEach((row) => row.addEventListener("click", () => {
    state.selectedRoute = row.dataset.route;
    render();
  }));
}''',
'''  document.getElementById("network-period-select")?.addEventListener("change", (event) => {
    state.networkPeriod = event.target.value;
    render();
  });
  document.querySelectorAll("[data-route]").forEach((row) => row.addEventListener("click", () => {
    state.selectedRoute = row.dataset.route;
    render();
  }));
}'''))

          applied = 0
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  applied += 1
              else:
                  print('Pattern already patched or not found:', old.splitlines()[0][:100])

          path.write_text(s, encoding='utf-8')
          print(f'Applied {applied}/{len(replacements)} dashboard QA replacements')
          if applied < 8:
              raise SystemExit('Too few patches applied; refusing to commit partial QA update')
          PY
          node --check web/app.js
      - name: Commit dashboard QA patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js
          if git diff --cached --quiet; then
            echo 'Dashboard already patched.'
          else
            git commit -m 'fix: make filter comparisons analytically consistent'
            git push
          fi
